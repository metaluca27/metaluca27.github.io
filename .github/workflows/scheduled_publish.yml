name: Scheduled Publish (daily rebuild)

# 예약 발행용. Gemini 글쓰기는 하지 않고 build.py만 다시 돌린다.
# content/posts/ 에 미래 날짜(date:)로 넣어둔 글은 build.py가 건너뛰다가,
# 그 날짜가 되면 이 액션이 아침에 빌드해서 자동으로 올라간다.
on:
  schedule:
    - cron: '0 0 * * *'   # 매일 UTC 00:00 = 한국 시간 오전 9시
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install markdown

      - name: Build site
        run: python build.py

      - name: Commit and push if a post was published
        run: |
          git config --global user.name "metaluca27"
          git config --global user.email "metaluca27@users.noreply.github.com"
          git add docs
          # 새 글 HTML이 생겼을 때만 커밋 (sitemap 시각만 바뀐 경우는 무시)
          if git diff --cached --name-only | grep -q '^docs/posts/'; then
            git commit -m "예약 발행 (Scheduled Publish)"
            git push origin main
          else
            echo "오늘 예약된 글 없음 — 커밋 생략"
          fi
